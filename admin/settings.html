<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings, Cyberyantra CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="settings">
<div class="app">
  <aside class="sidebar" id="sidebar-mount"></aside>
  <div class="main">
    <header class="topbar" id="topbar-mount"></header>
    <div class="content">
      <section class="view is-active" id="view-settings">
        <div class="view-head">
          <div>
            <h1>Settings</h1>
            <p class="view-sub">Console preferences and access control.</p>
          </div>
        </div>

        <div class="panel-row">
          <div class="panel">
            <div class="panel-head"><h2>Access</h2></div>
            <div class="form-grid">
              <label class="field">
                <span>Support contact email</span>
                <input type="text" value="support@cyberyantra.com">
              </label>
              <label class="field">
                <span>Notifications sender address</span>
                <input type="text" value="noreply@cyberyantra.com">
              </label>
              <label class="field">
                <span>Session timeout</span>
                <select>
                  <option>15 minutes</option>
                  <option selected>30 minutes</option>
                  <option>1 hour</option>
                </select>
              </label>
              <label class="checkbox"><input type="checkbox" checked> Require two factor for admin logins</label>
              <label class="checkbox"><input type="checkbox"> Allow API access from new IP addresses without review</label>
              <button class="btn btn-primary" style="width:fit-content">Save changes</button>
            </div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>Danger zone</h2></div>
            <p class="view-sub" style="margin-bottom:16px">These actions affect the whole platform.</p>
            <button class="btn btn-danger" style="width:fit-content">Put site into maintenance mode</button>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
